version: "2"
fields:
  - id: TS_AUTHKEY
    required: false
    secret: true
    target:
      type: environment
      name: TS_AUTHKEY
      service: tailscale
    title: Tailscale auth key (optional)
    description: >-
      Enter an auth key to sign in automatically, or leave this empty and open
      the login URL shown in the package logs. If a key is rejected, the package
      falls back to browser login. Replace or clear rejected keys in the package
      configuration. You can find your auth key in the
      [admin console](https://login.tailscale.com/admin/authkeys).
      For more information, see our [docs](https://docs.dappnode.io/docs/user/access-your-dappnode/vpn/tailscale).
