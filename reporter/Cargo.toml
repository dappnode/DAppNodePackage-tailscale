[package]
name = "tailscale-status-reporter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
publish = false

[dependencies]
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util", "test-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
